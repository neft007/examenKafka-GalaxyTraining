services:
  # ============================================================
  # 1. API Gym-Reservas (Punto 8: Build en caliente)
  # ============================================================
  gym-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: neft007/gym-reservas-api:latest
    container_name: gym-api
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://gym-db:5432/gimnasiodb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=gym-kafka:29092
    secrets:
      - db_password
    networks:
      - gym-network
    depends_on:
      gym-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s   # ✅ Aumentar a 60s para dar tiempo a Spring Boot

  # ============================================================
  # 2. PostgreSQL
  # ============================================================
  gym-db:
    image: postgres:16-alpine
    container_name: gym-db
    environment:
      - POSTGRES_DB=gimnasiodb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - gym_data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gimnasiodb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s   # ✅ Añadir start_period para evitar falsos negativos

  # ============================================================
  # 3. Adminer
  # ============================================================
  gym-adminer:
    image: adminer:latest
    container_name: gym-adminer
    ports:
      - "8081:8080"
    networks:
      - gym-network
    depends_on:
      - gym-db

  # ============================================================
  # 4. Redis
  # ============================================================
  gym-redis:
    image: redis:7-alpine
    container_name: gym-redis
    networks:
      - gym-network
    volumes:
      - redis_data:/data

  # ============================================================
  # 5. Worker
  # ============================================================
  gym-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: neft007/gym-reservas-api:latest
    container_name: gym-worker
    command: ["java", "-jar", "app.jar", "--spring.profiles.active=worker"]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://gym-db:5432/gimnasiodb
      - SPRING_DATASOURCE_USERNAME=postgres
    secrets:
      - db_password
    depends_on:
      gym-db:
        condition: service_healthy
    networks:
      - gym-network

  # ============================================================
  # 6. Frontend (HTML/CSS/JS + Nginx como proxy a la API)
  # ============================================================
  gym-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: neft007/gym-reservas-frontend:latest
    container_name: gym-frontend
    ports:
      - "3000:80"
    environment:
      - API_HOST=gym-api
      - API_PORT=8080
    networks:
      - gym-network
    # Sin depends_on: el front es independiente y arranca aunque la API no esté

  # ============================================================
  # 7. Apache Kafka (KRaft, sin Zookeeper)
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: gym-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@gym-kafka:9093
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LISTENERS: PLAINTEXT://gym-kafka:29092,CONTROLLER://gym-kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://gym-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server gym-kafka:29092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ============================================================
  # 8. Kafka UI
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: gym-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: gym-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: gym-kafka:29092
      KAFKA_CLUSTERS_0_READONLY: "false"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - gym-network

  # ============================================================
  # 9. MailHog (SMTP local + UI)
  # ============================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: gym-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - gym-network

# ============================================================
# Redes
# ============================================================
networks:
  gym-network:
    driver: bridge

# ============================================================
# Volúmenes
# ============================================================
volumes:
  gym_data:
  redis_data:
  kafka_data:

# ============================================================
# Secretos
# ============================================================
secrets:
  db_password:
    file: ./db_password.txt