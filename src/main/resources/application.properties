spring.application.name=gimnasio-reservas

# ============================================
# Configuración de PostgreSQL (para Docker)
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gimnasiodb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${db_password:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/actualiza el esquema al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Swagger UI
springdoc.swagger-ui.url=/gimnasio-openapi.yaml

# Leer secretos de Docker (configtree)
spring.config.import=optional:configtree:/run/secrets/

# ============================================
# Apache Kafka
# ============================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:gym-kafka:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
#spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
#spring.kafka.consumer.auto-offset-reset=earliest
#spring.kafka.consumer.properties.spring.json.trusted.packages=pe.edu.galaxy.training.java.sdd.gimnasio.domain.event
#spring.kafka.consumer.properties.spring.json.use.type.headers=false
#spring.kafka.consumer.properties.spring.json.value.default.type=pe.edu.galaxy.training.java.sdd.gimnasio.domain.event.ReservaConfirmadaEvent

# ============================================
# Mail (MailHog local)
# ============================================
spring.mail.host=${SPRING_MAIL_HOST:gym-mailhog}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Remitente por defecto
app.mail.from=notificaciones@gimnasio.local

# Schema Registry (Avro)
spring.kafka.properties.schema.registry.url=${SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL:http://gym-schema-registry:8081}

# Kafka Streams
spring.kafka.streams.application-id=gym-reservas-contador
spring.kafka.streams.bootstrap-servers=${spring.kafka.bootstrap-servers}
spring.kafka.streams.properties.schema.registry.url=${spring.kafka.properties.schema.registry.url}
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
# Limpiar estado local de Kafka Streams al arrancar (evitar huerfanos cuando se reconstruye)
spring.kafka.streams.cleanup.on-startup=true